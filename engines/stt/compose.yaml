services:
  stt:
    image: ghcr.io/speaches-ai/speaches@sha256:bd2ca473ada8cf2b4e0fd48cc4b5ba5622e42c55b6a2ddee4d03c5dfb7be9973
    container_name: ai-stt
    restart: "no"
    stop_signal: SIGINT
    gpus: all
    environment:
      HF_HOME: /home/ubuntu/.cache/huggingface
      WHISPER__TTL: "0"
    volumes:
      - /opt/ai-services/models/stt/hf-cache:/home/ubuntu/.cache/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - ai-services-internal

networks:
  ai-services-internal:
    external: true
