services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: ai-llm
    restart: "no"

    gpus: all

    command:
      - -m
      - /models/Qwen3-8B-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "16384"
      - --n-gpu-layers
      - "999"
      - --parallel
      - "1"
      - --alias
      - qwen3-8b
      - --jinja
      - --no-webui

    volumes:
      - /opt/ai-services/models/llm:/models:ro

    networks:
      - ai-services-internal

networks:
  ai-services-internal:
    external: true
