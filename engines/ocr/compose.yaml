services:
  ocr-vlm:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-genai-vllm-server@sha256:d0d32c04a2119613d25a0a4c292e165ccc107954b74580613cf59e378037f8f5
    container_name: ai-ocr-vlm
    restart: "no"
    gpus: all
    shm_size: 8g
    command:
      - /bin/bash
      - -c
      - >
        paddleocr genai_server
        --model_name PaddleOCR-VL-1.6-0.9B
        --model_dir /models/PaddleOCR-VL-1.6
        --host 0.0.0.0
        --port 8080
        --backend vllm
        --backend_config /config/backend_config.yaml
    volumes:
      - /opt/ai-services/models/ocr/paddle-data/official_models:/models:ro
      - ./backend_config.yaml:/config/backend_config.yaml:ro
    networks:
      - ai-services-internal

  ocr-api:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-vl@sha256:6c735bdf9e758ffdd58ccc067db0c2d84e37e5e6a2cbd47156069d4d7ea5d709
    container_name: ai-ocr-api
    restart: "no"
    gpus: all
    shm_size: 8g
    user: root
    environment:
      - VLM_BACKEND=vllm
    command:
      - /bin/bash
      - -c
      - paddlex --serve --pipeline /config/pipeline_config.yaml
    volumes:
      - /opt/ai-services/models/ocr/paddle-data/official_models:/models:ro
      - ./pipeline_config.yaml:/config/pipeline_config.yaml:ro
    networks:
      - ai-services-internal

networks:
  ai-services-internal:
    external: true
