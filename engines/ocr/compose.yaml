services:
  ocr-vlm:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-genai-vllm-server:latest-nvidia-gpu-offline
    container_name: ai-ocr-vlm
    restart: "no"
    gpus: all
    shm_size: 8g
    command:
      - /bin/bash
      - -c
      - >
        paddleocr genai_server
        --model_name PaddleOCR-VL-1.6-0.9B
        --model_dir /models/PaddleOCR-VL-1.6
        --host 0.0.0.0
        --port 8080
        --backend vllm
        --backend_config /config/backend_config.yaml
    volumes:
      - /opt/ai-services/models/ocr/paddle-data/official_models:/models:ro
      - ./backend_config.yaml:/config/backend_config.yaml:ro
    networks:
      - ai-services-internal

  ocr-api:
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-vl:latest-nvidia-gpu-offline
    container_name: ai-ocr-api
    restart: "no"
    gpus: all
    shm_size: 8g
    user: root
    environment:
      - VLM_BACKEND=vllm
    command:
      - /bin/bash
      - -c
      - paddlex --serve --pipeline /config/pipeline_config.yaml
    volumes:
      - /opt/ai-services/models/ocr/paddle-data/official_models:/models:ro
      - ./pipeline_config.yaml:/config/pipeline_config.yaml:ro
    networks:
      - ai-services-internal

networks:
  ai-services-internal:
    external: true
