services:
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:86-1.9
    container_name: ai-embeddings
    restart: "no"

    gpus: all

    command:
      - --model-id
      - /data/models--BAAI--bge-m3/snapshots/5617a9f61b028005a4858fdac845db406aefb181
      - --served-model-name
      - bge-m3
      - --dtype
      - float16
      - --hostname
      - 0.0.0.0
      - --port
      - "8080"
      - --max-batch-tokens
      - "16384"
      - --max-client-batch-size
      - "32"

    volumes:
      - /opt/ai-services/models/embeddings/hf-cache:/data:ro

    networks:
      - ai-services-internal

networks:
  ai-services-internal:
    external: true
