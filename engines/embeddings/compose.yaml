services:
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference@sha256:1911e69cf3d6a82c84e35412a6d2a0e51afdfe8c1405d0e5912aab533fbe317e
    container_name: ai-embeddings
    restart: "no"
    gpus: all
    command:
      - --model-id
      - /models/bge-m3
      - --served-model-name
      - bge-m3
      - --dtype
      - float16
      - --hostname
      - 0.0.0.0
      - --port
      - "8080"
      - --max-batch-tokens
      - "16384"
      - --max-client-batch-size
      - "32"
    volumes:
      - /opt/ai-services/models/embeddings/bge-m3:/models/bge-m3:ro
    networks:
      - ai-services-internal

networks:
  ai-services-internal:
    external: true
