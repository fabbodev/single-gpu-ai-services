services:
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    container_name: ai-gateway
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 256
    environment:
      AI_CLIENT_TOKENS_FILE: /run/ai-clients/client-tokens.json
      AI_DISPATCHER_TOKEN_FILE: /run/secrets/dispatcher-token
      AI_MAX_INFLIGHT_REQUESTS: "${AI_MAX_INFLIGHT_REQUESTS:-8}"
      AI_MAX_OCR_UPLOAD_BYTES: "${AI_MAX_OCR_UPLOAD_BYTES:-33554432}"
      AI_MAX_STT_UPLOAD_BYTES: "${AI_MAX_STT_UPLOAD_BYTES:-134217728}"
    volumes:
      - type: bind
        source: "${AI_CLIENT_REGISTRY_DIR:-/etc/ai-services/clients}"
        target: /run/ai-clients
        read_only: true
        bind:
          create_host_path: false
      - "${AI_SECRETS_DIR:-/etc/ai-services/secrets}/dispatcher-token:/run/secrets/dispatcher-token:ro"
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:8090:8090"
    networks:
      - ai-services-internal

networks:
  ai-services-internal:
    external: true
